<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | DeepBlue</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-bubbles{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
  pointer-events:none;
}

.bubble {
  position: absolute;
  bottom: -50px;
  left: var(--x);

  width: var(--s);
  height: var(--s);

  background: rgba(144,224,239,0.35);

  border-radius: 50%;

  animation: rise var(--d) ease-in infinite;
}

@keyframes rise {
  0% {
    bottom: -50px;
    opacity: 0;
    transform: translateX(0);
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 0.6;
  }
